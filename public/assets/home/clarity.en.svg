<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630">
  <title>One clear alert organized into four key details</title>
  <defs>
    <style>
      .code{fill:#a06b1d;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
      .side-title{fill:#1e333f;font:500 26px Georgia,serif}
      .side-body{fill:#526874;font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ui{fill:#20323c;font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ui-muted{fill:#78878f;font:12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ui-code{fill:#9b661e;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
    </style>
  </defs>
  <g>
    <text class="code" x="44" y="157">01 · WHAT</text>
    <text class="side-title" x="44" y="197">What happened</text>
    <text class="side-body" x="44" y="226">Risk type and severity</text>
    <text class="code" x="1010" y="157">02 · WHERE</text>
    <text class="side-title" x="1010" y="197">Where it matters</text>
    <text class="side-body" x="1010" y="226">Relation to your chosen place</text>
    <text class="code" x="44" y="433">03 · WHEN</text>
    <text class="side-title" x="44" y="473">Key timing</text>
    <text class="side-body" x="44" y="502">Occurrence, start, or update time</text>
    <text class="code" x="1010" y="433">04 · ACTION</text>
    <text class="side-title" x="1010" y="473">First action</text>
    <text class="side-body" x="1010" y="502">Reviewed, fixed action language</text>
  </g>
  <g>
    <rect x="409" y="35" width="422" height="550" rx="54" fill="#f7f7f3" stroke="#d7dad6" stroke-width="1.5"/>
    <path d="M562 35H678V65H562Z" fill="#13242e"/>
    <rect x="430" y="84" width="380" height="386" rx="25" fill="#fff" stroke="#d7dad6" stroke-width="1.3"/>
    <circle cx="464" cy="120" r="10" fill="#fff" stroke="#334b58"/>
    <circle cx="464" cy="120" r="3" fill="#e7a13a"/>
    <text class="ui-muted" x="486" y="125">ORBIS</text>
    <text class="ui-muted" x="750" y="125">NOW</text>
    <text x="458" y="175" fill="#1f3039" font-family="Georgia, serif" font-size="29">HEAVY RAIN · CAUTION</text>
    <text class="ui" x="458" y="202">Relevant to a place you care about</text>
    <path d="M458 237H782" stroke="#d7dad6" stroke-width="1.3"/>
    <text class="ui-code" x="458" y="269">IMPACT</text>
    <text class="ui-code" x="621" y="269">UPDATED</text>
    <text class="ui" x="458" y="296">STARTS TONIGHT</text>
    <text class="ui" x="621" y="296">JUST NOW</text>
    <path d="M458 313H782" stroke="#d7dad6" stroke-width="1.3"/>
    <text class="ui-code" x="458" y="347">FIRST ACTION</text>
    <path d="M458 381H782" stroke="#d7dad6" stroke-width="1.3"/>
    <text class="ui" x="458" y="410">
      <tspan x="458">Limit unnecessary travel and follow</tspan><tspan x="458" dy="20">local official information.</tspan>
    </text>
    <text class="ui-muted" x="458" y="449">Sources and complete details are available</text>
  </g>
</svg>
